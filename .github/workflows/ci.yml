name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-laravel
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('api-laravel/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      # phpunit.xml uses SQLite in memory and fakes HTTP to the audit service.
      - run: php artisan test

  # Same tests against real MySQL 8.4 (what production uses). SQLite ignores
  # row locks (lockForUpdate), so this job is what really exercises the locking code,
  # plus MySQL-specific behaviour like foreign keys and index definitions.
  laravel-mysql:
    name: Laravel API tests (MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-laravel
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: quote_manager_test
          MYSQL_USER: quote_user
          MYSQL_PASSWORD: quote_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Real environment variables win over the <env> values in phpunit.xml.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: quote_manager_test
      DB_USERNAME: quote_user
      DB_PASSWORD: quote_password
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('api-laravel/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: php artisan test

  audit-service:
    name: Audit service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit-service
    services:
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: audit_user
          MONGO_INITDB_ROOT_PASSWORD: audit_password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_TEST_URI: mongodb://audit_user:audit_password@localhost:27017/audit_service_test?authSource=admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: audit-service/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
